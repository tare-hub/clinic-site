<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — MedCare Clinic</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  .notfound{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:linear-gradient(135deg,#f0f4f8,#e8f0fe);}
  .notfound-inner{max-width:480px;}
  .notfound-code{font-size:7rem;font-weight:900;color:#1a73e8;line-height:1;margin-bottom:8px;opacity:.15;}
  .notfound-icon{font-size:4rem;color:#1a73e8;margin-bottom:16px;}
  .notfound-inner h1{font-size:1.8rem;font-weight:800;color:#1a1a2e;margin-bottom:12px;}
  .notfound-inner p{color:#64748b;margin-bottom:28px;line-height:1.7;}
  .notfound-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
</style>
</head>
<body>
<div class="notfound">
  <div class="notfound-inner">
    <div class="notfound-code">404</div>
    <div class="notfound-icon"><i class="fa fa-circle-exclamation"></i></div>
    <h1>Page Not Found</h1>
    <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
    <div class="notfound-links">
      <a href="index.html" class="btn btn-primary"><i class="fa fa-house"></i> Go Home</a>
      <a href="appointment.html" class="btn btn-outline" style="color:#1a73e8;border-color:#1a73e8;">Book Appointment</a>
    </div>
  </div>
</div>
</body>
</html>
